<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Cadastro de Cliente</title>
    <style>
        /* Estilos básicos para o corpo da página */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }

        /* Container principal dos formulários */
        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        /* Estilos para o cabeçalho (abas) */
        .form-header {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab-button {
            flex-grow: 1;
            padding: 10px 0;
            text-align: center;
            cursor: pointer;
            font-size: 1.1em;
            color: #555;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }

        .tab-button.active {
            color: #007bff;
            border-bottom: 2px solid #007bff;
            font-weight: bold;
        }

        /* Estilos para os campos do formulário */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Garante que o padding não aumente a largura total */
        }

        /* Estilo do botão de submissão */
        .submit-button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s;
        }

        .submit-button:hover {
            background-color: #0056b3;
        }

        /* Esconder o formulário inativo */
        .form-content {
            display: none;
        }

        .form-content.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-header">
        <div class="tab-button active" onclick="showForm('login')">LOGIN</div>
        <div class="tab-button" onclick="showForm('cadastro')">CADASTRO</div>
    </div>

    <div id="login" class="form-content active">
        <h2>Acesso à Conta</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" name="email" required>
            </div>
            <div class="form-group">
                <label for="login-password">Senha:</label>
                <input type="password" id="login-password" name="password" required>
            </div>
            <button type="submit" class="submit-button">Entrar</button>
        </form>
    </div>

    <div id="cadastro" class="form-content">
        <h2>Criar Nova Conta</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="cadastro-nome">Nome Completo:</label>
                <input type="text" id="cadastro-nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="cadastro-email">Email:</label>
                <input type="email" id="cadastro-email" name="email" required>
            </div>
            <div class="form-group">
                <label for="cadastro-password">Senha:</label>
                <input type="password" id="cadastro-password" name="password" required>
            </div>
             <div class="form-group">
                <label for="cadastro-telefone">Telefone (Opcional):</label>
                <input type="text" id="cadastro-telefone" name="telefone">
            </div>
            <button type="submit" class="submit-button">Cadastrar</button>
        </form>
    </div>
</div>

<script>
    // Função JavaScript para alternar entre Login e Cadastro
    function showForm(formId) {
        // Remove a classe 'active' de todos os conteúdos e botões
        document.querySelectorAll('.form-content').forEach(content => {
            content.classList.remove('active');
        });
        document.querySelectorAll('.tab-button').forEach(button => {
            button.classList.remove('active');
        });

        // Adiciona a classe 'active' ao conteúdo e botão selecionados
        document.getElementById(formId).classList.add('active');
        // Encontra e ativa o botão correspondente
        if (formId === 'login') {
            document.querySelector('.form-header .tab-button:nth-child(1)').classList.add('active');
        } else if (formId === 'cadastro') {
            document.querySelector('.form-header .tab-button:nth-child(2)').classList.add('active');
        }
    }
</script>

</body>
</html>
